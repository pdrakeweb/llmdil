[package]
name = "local-llm-service-manager"
version = "0.1.31"
edition = "2021"

# NOTE: excluded from the Cargo workspace (see root Cargo.toml `exclude`).
# Builds on Windows via the release workflow (tauri-action). Not expected to
# compile on this Linux VM (no GTK/WebKit); kept syntactically valid.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
manager-config = { path = "../crates/manager-config" }
manager-wizard = { path = "../crates/manager-wizard" }
manager-supervisor = { path = "../crates/manager-supervisor" }
manager-telemetry = { path = "../crates/manager-telemetry" }
manager-gateway = { path = "../crates/manager-gateway" }
manager-models = { path = "../crates/manager-models" }
manager-mcp = { path = "../crates/manager-mcp" }
manager-mxc = { path = "../crates/manager-mxc" }
manager-winml = { path = "../crates/manager-winml" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
