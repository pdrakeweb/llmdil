[workspace]
members = ["crates/*"]
exclude = ["src-tauri"]
resolver = "2"

[workspace.dependencies]
# Admin API (manager-api)
axum = { version = "0.8", features = ["json", "query", "tokio"] }
tower = { version = "0.5", features = ["util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustls-pemfile = "2"
argon2 = "0.5"
hmac = "0.12"
sha1 = "0.10"
# Pairing QR on the desktop Remote Access card (PLAN.md §3.8/§9):
# pure-Rust encoder, SVG renderer only (no `image` dependency).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
quick-xml = "0.38"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# OS CSPRNG for generated secrets (gateway master key, recovery
# codes). Already in the lock transitively (via zip), so declaring it
# adds no new code to the build.
getrandom = "0.3"
# Linear-time regex (finite automata, no backtracking) for pricing
# operator-supplied `--override-tensor` patterns against GGUF tensor
# names (manager-models).
regex = "1"
tracing = "0.1"
# The app's one logging pipeline (manager-app::logging, T-05):
# env-filter for RUST_LOG, fmt for the stderr layer, json for the
# app.log JSON Lines file layer. No ANSI colours, no `log` bridge.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "env-filter", "json"] }
async-trait = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# CLI/TUI client (manager-cli)
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
rustls-webpki = { version = "0.103", features = ["ring"] }
