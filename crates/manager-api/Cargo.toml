[package]
name = "manager-api"
version = "0.1.60"
edition = "2021"

# Admin REST API (admin-api plan phase 1): the axum surface over
# manager-app. The router is generated from manager-app's operation
# registry (OP_SPECS) — routes, argument validation, and (phase 2)
# authorization guards all derive from the single declaration, so
# the REST surface cannot drift from the desktop's capabilities.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
thiserror = { workspace = true }
argon2 = { workspace = true }
async-trait = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
getrandom = { workspace = true }
futures-core = { workspace = true }
tracing = { workspace = true }
qrcode = { workspace = true }
manager-app = { path = "../manager-app" }
manager-config = { path = "../manager-config" }
manager-wizard = { path = "../manager-wizard" }

# Interface enumeration for the bind choice (src/bind.rs): the same
# version and API family the log receiver already uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
reqwest = { workspace = true }
