[package]
name = "manager-models"
version = "0.1.63"
edition = "2021"

[dependencies]
manager-config = { path = "../manager-config" }
serde = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
sha2 = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }

# Tier copies: background I/O priority, free space, volume roots.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
