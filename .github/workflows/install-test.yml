name: Install Test

# Runs AFTER a release is published (and on manual dispatch), so it never
# delays installer availability. Downloads the published installer onto a
# fresh Windows runner, silent-installs it, verifies the payload, launches
# the app briefly, then silent-uninstalls. Catches installer/config
# regressions that the build alone cannot.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (e.g. v0.1.1)"
        required: true

permissions:
  contents: read

jobs:
  test-install:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download installer from release
        run: gh release download ${{ github.event.release.tag_name || inputs.tag }} --repo pdrakeweb/llmdil --pattern "*-setup.exe" --dir installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Silent install
        timeout-minutes: 10
        run: |
          $exe = Get-ChildItem installer\*-setup.exe | Select-Object -First 1
          # Clear Mark-of-the-Web so SmartScreen doesn't block the unsigned installer
          Unblock-File -Path $exe.FullName
          Write-Host "Installing $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with code $($p.ExitCode)" }

      - name: Verify installation
        run: |
          $dir = "$env:LOCALAPPDATA\LLMdil"
          if (-not (Test-Path $dir)) {
            Write-Host "Expected dir missing; LOCALAPPDATA contains:"
            Get-ChildItem $env:LOCALAPPDATA | Select-Object Name
            throw "install dir not found: $dir"
          }
          $appExe = Get-ChildItem "$dir\*.exe" -Recurse | Where-Object { $_.Name -notlike "*ninstall*" -and $_.Name -notin @("llm-service-host.exe", "llmdil-log-receiver.exe") } | Select-Object -First 1
          if (-not $appExe) { throw "no application exe found under $dir" }
          Write-Host "Installed app exe: $($appExe.FullName)"
          # The bundled sidecars deploy/option surfaces rely on:
          # the service host shim and the log receiver.
          foreach ($sidecar in @("llm-service-host.exe", "llmdil-log-receiver.exe")) {
            if (-not (Test-Path "$dir\$sidecar")) { throw "bundled sidecar missing from install: $sidecar" }
            Write-Host "Bundled sidecar present: $sidecar"
          }
          echo "APP_EXE=$($appExe.FullName)" >> $env:GITHUB_ENV

      - name: Launch smoke test
        run: |
          $p = Start-Process -FilePath "$env:APP_EXE" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "app exited within 20s with code $($p.ExitCode)" }
          Write-Host "App stayed alive for 20s (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Silent uninstall
        run: |
          $un = Get-ChildItem "$env:LOCALAPPDATA\LLMdil\uninstall.exe" -Recurse | Select-Object -First 1
          if (-not $un) { throw "uninstaller not found" }
          $p = Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exited with code $($p.ExitCode)" }
          if (Test-Path "$env:LOCALAPPDATA\LLMdil") { throw "install dir still present after uninstall" }
          Write-Host "Uninstall clean"
